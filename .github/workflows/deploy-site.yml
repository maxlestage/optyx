# Publie le site vitrine (site/) sur GitHub Pages via la branche
# gh-pages — la voie qui s'active toute seule sur un dépôt public. La
# méthode « artefact Pages » échouait : l'activation de Pages par
# configure-pages exige des droits d'administration que le jeton des
# workflows n'a pas (« Resource not accessible by integration »).
#
# NB : les merges du bot d'auto-merge n'émettent pas d'événements de
# workflow (jeton GITHUB_TOKEN) — le déclenchement est donc surtout
# manuel (workflow_dispatch, y compris via l'API).
# URL : https://maxlestage.github.io/optyx/
name: Déploiement du site

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Construire le site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publier sur gh-pages
        working-directory: site/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site vitrine — ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
