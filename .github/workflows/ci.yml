name: CI

# CI du projet : compilation du site vitrine (site/), puis merge
# automatique de la pull request quand le build est vert.
#
# Cette CI compilait auparavant l'app iOS sur simulateur. L'app a été
# retirée du dépôt ; laisser un `xcodebuild` sans projet Xcode aurait
# rendu la CI rouge en permanence, et supprimer le fichier aurait
# emporté avec lui le merge automatique — d'où le remplacement du job de
# build plutôt que sa suppression.
#
# La CI ne modifie JAMAIS le dépôt : aucun bump de version, aucun commit
# généré. Le déploiement du site est traité par deploy-site.yml
# (GitHub Pages) et par Heroku (heroku.yml).

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Installer les dépendances
        working-directory: site
        run: npm ci --include=dev --no-audit --no-fund

      - name: Compiler le site
        working-directory: site
        run: npm run build

  automerge:
    name: Merge automatique
    needs: build
    # Uniquement les PR du dépôt lui-même (jamais un fork) : le build
    # vert vaut validation, la PR est mergée sans intervention.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merger la pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --merge
